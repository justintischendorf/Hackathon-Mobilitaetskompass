<div class="form-wizard">
  <!-- Progress bar -->
  <div class="progress-bar-wrapper" role="progressbar" [attr.aria-valuenow]="progress" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar" [style.width.%]="progress"></div>
  </div>

  <!-- Step indicators -->
  <div class="step-indicators">
    @for (s of steps; track s.key; let i = $index) {
      <button
        class="step-dot"
        [class.active]="i === currentStep()"
        [class.completed]="i < currentStep()"
        (click)="currentStep.set(i)"
        [attr.aria-label]="s.label"
        type="button"
      >
        <span class="dot-icon">{{ i < currentStep() ? '✓' : s.icon }}</span>
        <span class="dot-label">{{ s.label }}</span>
      </button>
    }
  </div>

  <!-- Current step content -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="step-content">
    <div class="step-header">
      <span class="step-counter">Schritt {{ currentStep() + 1 }} von {{ steps.length }}</span>
      <h2 class="step-title">
        <span class="step-title-icon">{{ step.icon }}</span>
        {{ step.label }}
      </h2>
      <p class="step-description">{{ step.description }}</p>
    </div>

    <!-- Rating buttons -->
    <div class="rating-group" role="radiogroup" [attr.aria-label]="step.label + ' bewerten'">
      @for (val of values; track val) {
        <button
          type="button"
          class="rating-btn"
          [class.selected]="getControl(step.key).value === val"
          (click)="selectValue(val)"
          [attr.aria-label]="step.labels[val - 1]"
          [attr.aria-pressed]="getControl(step.key).value === val"
        >
          <span class="rating-value">{{ val }}</span>
          <span class="rating-label">{{ step.labels[val - 1] }}</span>
        </button>
      }
    </div>

    <div class="range-hints">
      <span>{{ step.rangeHints[0] }}</span>
      <span>{{ step.rangeHints[1] }}</span>
    </div>

    <!-- Navigation -->
    <div class="step-actions">
      @if (!isFirst) {
        <button type="button" class="btn-back" (click)="back()">
          ← Zurück
        </button>
      }

      @if (isLast) {
        <button type="submit" class="btn-primary submit-btn" [disabled]="form.invalid">
          Analyse starten →
        </button>
      } @else {
        <button type="button" class="btn-primary" (click)="next()">
          Weiter →
        </button>
      }
    </div>
  </form>
</div>
